形态特征:
  生活型: 落叶灌木
  枝: 小枝密被黄色星状绒毛
  叶: 叶菱形或三角状卵形，基部楔形，具不整齐缺齿，基脉3
  花: 花单生枝端叶腋，花萼钟形，裂片5，三角形，花冠钟形，淡紫色，花瓣5，雄蕊柱长约3厘米，花柱分枝5
  果: 蒴果卵圆形，径约1.2厘米，密被黄色星状绒毛，具短喙；种子肾形，背部被黄白色长柔毛
  种子: 种子肾形
生态习性:
  产地: 台湾、福建、广东、广西、云南、贵州、四川、湖南、湖北、安徽、江西、浙江、江苏、山东、河北、河南、陕西等省区、均有栽培、系我国中部各省原产
  物候: 花期7-11月
功用价值:
  经济价值: 主供园林观赏，茎皮富含纤维，可入药
  植物文化: '园花笑芳年，池草艳春色；

    犹不如槿花，婵娟玉阶侧；

    芬荣何夭促，零落在瞬息；

    岂若琼树枝，终岁长翕赩；

    ——唐 李白《咏槿》'
