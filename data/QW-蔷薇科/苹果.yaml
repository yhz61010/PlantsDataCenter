备注: 'SYN 注：学名已修订，接受名为Malus domestica。

  6. 苹果（采兰杂志）　柰（西京杂记），西洋苹果（中国树木分类学）

  Malus pumila Mill. Gard. Dict. ed. 8. M. no. 3. 1768; Schneid. Ill. Handb. Laubh. 1: 715. 1906 & in Fedde, Repert. Sp. Nov. 3: 177. 1906; Hand. -Mazz. Symb. Sin. 7: 463. 1933; 陈嵘, 中国树木分类学417. 图315. 1937; 刘慎谔等, 东北木本植物图志301. 图版105. 213. 1955; 俞德浚、阎振茏, 植物分类学报5: 90. 1956; Steward, Man. Vase. Pl. Lower Yangtze Valley 172. 1958; 北京师范大学, 北京植物志上册398. 1962; 中国高等植物图鉴 2: 236. 图2201. 1972. ——Pyrus malus L. Sp. Pl. 479. 1753. ——Malus dasyphylla Borkh. Theor. -Prakt. Handb. Forst. 2: 1271. 1803; Koidz. in Acta Phytotax. Geobot. 3: 189. 1934. ——Malus domestica Borkh. l. c. 1272. 1803; Juzep. in Fl. URSS 9: 365. 1939. ——Malus communis Poir. Encycl. Meth. Bot. 5: 560. 1840. ——Malus pumila var. domestics Schneid. Ill. Handb. Laubh. 1: 715. f. 396. 1906.——Pyrus malus var. pumila Henry in Elwes & Henry, Trees Gt. Brit. Irel. 6: 1570. 1912. ——Malus dasyphylla var. domestica Koidz. in Acta Phytotax. Geobot. 3: 189. 1934. ——Malus silvestris subsp. mitis Mansfeld. in Fedde, Repert. Sp. Nov. 49: 45. 1940.

  乔木，高可达15米，多具有圆形树冠和短主干；小枝短而粗，圆柱形，幼嫩时密被绒毛，老枝紫褐色，无毛；冬芽卵形，先端钝，密被短柔毛。叶片椭圆形、卵形至宽椭圆形，长4.5-10厘米，宽3-5.5厘米，先端急尖，基部宽楔形或圆形，边缘具有圆钝锯齿，幼嫩时两面具短柔毛，长成后上面无毛；叶柄粗壮，长约1.5-3厘米，被短柔毛；托叶草质，披针形，先端渐尖，全缘，密被短柔毛，早落。伞房花序，具花3-7朵，集生于小枝顶端，花梗长1-2.5厘米，密被绒毛；苞片膜质，线状披针形，先端渐尖，全缘，被绒毛；花直径3-4厘米；萼筒外面密被绒毛；萼片三角披针形或三角卵形，长6-8毫米，先端渐尖，全缘，内外两面均密被绒毛，萼片比萼筒长；花瓣倒卵形，长15-18毫米，基部具短爪，白色，含苞未放时带粉红色；雄蕊20，花丝长短不齐，约等于花瓣之半；花柱5，下半部密被灰白色绒毛，较雄蕊稍长。果实扁球形，直径在2厘米以上，先端常有隆起，萼洼下陷，萼片永存，果梗短粗。花期5月，果期7-10月。

  辽宁、河北、山西、山东、陕西、甘肃、四川、云南、西藏常见栽培。适生于山坡梯田、平原矿野以及黄土丘陵等处，海拔50-2500米。原产欧洲及亚洲中部，栽培历史已久，全世界温带地区均有种植。

  本种是著名落叶果树，经济价值很高。全世界栽培品种总数在一千以上。我国现在栽培的重要品种有自欧美直接输入者，也有自日本转来者，也有自己培育成的新品种。早期栽培的中国苹果品种有片红、彩苹、白檎等，属于早熟种，不耐储藏，经久质变，俗称绵苹果。河北、山西、陕西、甘肃等地有小量生产。近期传入中国的苹果，俗称西洋苹果，系在1870年开始引入烟台，以后在青岛、威海卫以及辽宁、河北等地陆续栽培。现在我国苹果的生产以辽宁的熊岳、大连、金县，河北的昌黎、秦皇岛，山东的烟台、龙口、青岛等地为重点产区。早熟品种有黄魁、红魁、金花、早生赤，中熟品种有祝、旭、金冠、优花皮，晚熟品种有红玉、国光、白龙、元帅、香蕉等。河北出产的香果或名虎拉车可能为本种与花红的杂交种。'
