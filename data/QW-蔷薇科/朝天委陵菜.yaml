植物志: '66.朝天委陵菜（中国高等植物图鉴）伏萎陵菜（东北植物检索表），仰卧委陵菜（江苏南部种子植物手册）、铺地委陵菜（秦岭植物志），鸡毛菜（东北）

  Potentilla supina L. Sp. Pl. 497. 1753; Wolf in Bibl. Bot. 71:389. 1908: 东北植物检索表152.图版46: 图2. 1959;中国高等植物图鉴2: 295. 图2320. 1972. ——P. paradoxa Nutt. ex Torr. et Gray, Fl. N. Am. 1:437. 1840;江苏南部种子植物手册368. 图593. 19.59;秦岭植物志1 (2): 5500图459。1974;东北草本植物志5: 33. 图版15: 图1-2. 1976. ——P. supina L. var. paradoxa (Nutt.) Wolf in Bibl. Bot. 71: 393. 1908; Sojak. in Folia Geobot. ＆ Phytot. (Praha) 4:207. 1969. ——p. supina L. var. egibbosa Wolf in Bibl. Bot. 71: 392. 1908. ——p. fauriei Levl. in Fedde, Repert. Sp. Nov. 2:198. 1909.

  66a.朝天委陵菜（原变种）

  P. supina L. var. supina

  一年生或二年生草本。主根细长，并有稀疏侧根。茎平展，上升或直立，叉状分枝，长20-50厘米，被疏柔毛或脱落几无毛。基生叶羽状复叶，有小叶2-5对，间隔0.8-1.2厘米，连叶柄长4-15厘米，叶柄被疏柔毛或脱落几无毛；小叶互生或对生，无柄，最上面1-2对小叶基部下延与叶轴合生，小叶片长圆形或倒卵状长圆形，通常长1-2.5厘米，宽0.5-1.5厘米，顶端圆钝或急尖，基部楔形或宽楔形，边缘有圆钝或缺刻状锯齿，两面绿色，被稀疏柔毛或脱落几无毛；茎生叶与基生叶相似，向上小叶对数逐渐减少；基生叶托叶膜质，褐色，外面被疏柔毛或几无毛，茎生叶托叶草质，绿色，全缘，有齿或分裂。花茎上多叶，下部花自叶腋生，顶端呈伞房状聚伞花序；花梗长0.8-1.5厘米，常密被短柔毛；花直径0.6-0.8厘米；萼片三角卵形，顶端急尖，副萼片长椭圆形或椭圆披针形，顶端急尖，比萼片稍长或近等长；花瓣黄色，倒卵形，顶端微凹，与萼片近等长或较短；花柱近顶生，基部乳头状膨大，花柱扩大。瘦果长圆形，先端尖，表面具脉纹，腹部鼓胀若翅或有时不明显。花果期3-10月。

  产黑龙江，吉林，辽宁、内蒙古、河北、山西、陕西、宁夏、甘肃、新疆、山东、河南、江苏、浙江、安徽、江西、湖北、湖南、广东、四川、贵州、云南、西藏。生田边、荒地、河岸沙地、草甸、山坡湿地，海拔100-2000米。广布于北半球温带及部分亚热带地区。

  66b.三叶朝天委陵菜（变种）

  P. supina L. var. teynata Peterm. Anal. Pflanzenschl. Lot. 1846.——P. amurensis Maxim. iPrim. Fl. Amur. 98. 1859. ——P. supina L. var. egibbosa wolff. ternata (Peterm.) Wolf in Bibl. Bot. 71: 392. 1908. ——P. supina L. var. campestris Card. in Lecomte, Not. Syst. 3: 237. 1914.

  植株分枝极多，矮小铺地或微上升，稀直立；基生叶有小叶3枚，顶生小叶有短柄或几无柄，常2-3深裂或不裂。

  产黑龙江、辽宁、河北、山西、陕西、甘肃、新疆、河南、安徽，、江苏、浙江、江西、广东、四川、贵州、云南。生水湿地边、荒坡草地、河岸沙地及盐碱地，海拔100-1900米。苏联远东地区也有分布。

