形态特征:
  生活型: 木质落叶大藤本
  枝: 小枝无毛或嫩时被极稀疏柔毛，老枝无木栓翅
  叶: 单叶，倒卵圆形，通常3裂，幼苗或下部枝上叶较小，长4.5-20厘米，基部心形，有粗锯齿，两面无毛或下面脉上有短柔毛；叶柄长4-20厘米，无毛或疏生短柔毛
  花: 花序生短枝上，基部分枝，形成多歧聚伞花序，序轴不明显，花序梗长1-3.5厘米；花萼碟形，边缘全缘或呈波状，无毛；花瓣长椭圆形
  果: 果球形，成熟时蓝色，径1-1.5厘米，有种子1-3
生态习性:
  产地: 吉林、辽宁、河北、河南、山东、安徽、江苏、浙江、福建、台湾
  分布: 朝鲜、日本
  特有: 特产
  生境: 山坡崖石壁或灌丛
  海拔: 150-1200m
  物候: 花期5-8月，果期9-10月
功用价值: 暂无数据
植物志: '产吉林、辽宁、河北、河南、山东、安徽、江苏、浙江、福建、台湾。生山坡崖石壁或灌丛，海拔150-1200米。朝鲜、日本也有分布。

  本种早为著名的垂直绿化植物，枝叶茂密，分枝多而斜展；根入药，能祛瘀消肿。

  6.地锦（本草纲目）土鼓藤（植物名实图考），红葡萄藤（狄尔土中国植物名录），趴墙虎（南京），爬山虎（经济植物手册）图版4：1-6

  Parthenocissus tricuspidata (Sieb. & Zucc.) Planch. in DC. Monogr. Phan. 5: 452. 1887; Sprag. in Bot. Mag. 135: t. 8287. 1909; Gagnep. in Sarg. Pl. Wils. 1: 102. 1911 et in Humbert, Suppl. Fl. Gen. Indo-Chine. 1. 905. 1950; Hand.-Mazz Symb. Sin. 7: 680. 1933; Rehd. in Journ. Arn. Arb. 15: 23. 1934 et Man. Cult. Trees & Shrubs ed. 2. 620. 1940;陈嵘, 中国树木分类学760.图647. 1937; Suesseng. in Pflanzenfam. ed. 2. 20d: 311. 1953;胡先骕, 经济植物手册下册963. 1957; Li. Woody, Fl. Taiwan. 526. f. 204. 1963; Lauener in Notes Roy. Bot. Gard. Edinb. 37 (3): 284. 1967; 中国高等植物图鉴2: 775.图3280. 1972; 台湾植物志3: 672. 1977; W. T. Wang in Acta Phytotax. Sin. 17 (3): 90. 1979 in clavi, 江苏植物志下册475. 1982; 云南种子植物名录上册798. 1984; 河北植物志2: 118.图1021. 1988;河南植物志2: 605. 1988;福建植物志3: 374.图262. 1988. ——Ampelopsis tricuspidata Sieb. & Zucc. in Abh. Math.-Phys. Cl. Akad. Wiss. Munch. 4 (2): 196. 1845.——Cissus thunbergii Sieb. & Zucc. in Ahb. Math.-Phys. Cl. Akad. Wiss. Munch. 4 (2): 195. 1845.——Vitis inconstans Miq. in Ann. Mus. Bot. Lugd.-Bat. 1: 91. 1863. ——Quinaria tricuspidata Koehne, Deutsch. Dendr. 383. 1893.——Psedera tricuspidata Rehd. in Rhodora 10: 29. 1908.——Psedera thunbergii (Sieb. & Zucc.) Nakai in Bot. Mag. Tokyo. 35: 2. 1921 et Fl. Sylv. Kor. 12: 2. Pl. 1. 1922.——Vitis taquetii Levl. in Bull. Acad. Intern. Geog. Bot. 20: 11. 1910.——Parthenocissus thunbergii (Sieb. & Zucc.) Nakai in Journ. Bot. 6: 254. 1930; 东北木本植物图志412.图版CXXXII图320. 1955.

  木质藤本。小枝圆柱形，几无毛或微被疏柔毛。卷须5-9分枝，相隔2节间断与叶对生。卷须顶端嫩时膨大呈圆珠形，后遇附着物扩大成吸盘。叶为单叶，通常着生在短枝上为3浅裂，时有着生在长枝上者小型不裂，叶片通常倒卵圆形，长4.5-17厘米，宽4-16厘米，顶端裂片急尖，基部心形，边缘有粗锯齿，上面绿色，无毛，下面浅绿色，无毛或中脉上疏生短柔毛，基出脉5，中央脉有侧脉3-5对，网脉上面不明显，下面微突出；叶柄长4-12厘米，无毛或疏生短柔毛。花序着生在短枝上，基部分枝，形成多歧聚伞花序，长2.5-12.5厘米，主轴不明显；花序梗长1-3.5厘米，几无毛；花梗长2-3毫米，无毛；花蕾倒卵椭圆形，高2-3毫米，顶端圆形；萼碟形，边缘全缘或呈波状，无毛；花瓣5，长椭圆形，高1.8-2.7毫米，无毛；雄蕊5，花丝长约1.5-2.4毫米，花药长椭圆卵形，长0.7-1.4毫米，花盘不明显；子房椭球形，花柱明显，基部粗，柱头不扩大。果实球形，直径1-1.5厘米，有种子1-3颗；种子倒卵圆形，顶端圆形，基部急尖成短喙，种脐在背面中部呈圆形，腹部中梭脊突出，两侧洼穴呈沟状，从种子基部向上达种子顶端。花期5-8月，果期9-10月。

  产吉林、辽宁、河北、河南、山东、安徽、江苏、浙江、福建、台湾。生山坡崖石壁或灌丛，海拔150-1200米。朝鲜、日本也有分布。

  本种早为著名的垂直绿化植物，枝叶茂密，分枝多而斜展；根入药，能祛瘀消肿。

  春季刚萌发的新叶因花青素含量较高，呈现你之前拍到的紫红色；随着叶片生长、叶绿素大量合成，就会转成这种鲜亮的翠绿色；入秋后气温下降，叶片会再次积累花青素，变为艳丽的橙红色，季相观赏效果突出。

  春之序曲（萌发期）：鲜亮紫红（花青素的保护伞）

  夏之盛宴（成熟期）：转为深绿（高效的能量工厂）

  秋之谢幕（谢幕期）：橙红如火（震撼的季相高潮）'
