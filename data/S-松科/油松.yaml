形态特征:
  生活型: 乔木
  株: 高达25米，胸径可达1米以上
  茎: 树皮灰褐色或褐灰色，裂成不规则较厚的鳞状块片，裂缝及上部树皮红褐色
  枝: 一年生枝较粗，淡红褐或淡灰黄色，无毛，幼时微被白粉；冬芽圆柱形，红褐色
  叶: 叶二针一束，粗硬
  花: 雄球花圆柱形，长1.2-1.8厘米，在新枝下部聚生成穗状
  果: 球果卵形或圆卵形，长4-9厘米，有短梗，向下弯垂，成熟前绿色，熟时淡黄色或淡褐黄色，常宿存树上近数年之久；中部种鳞近矩圆状倒卵形，长1.6-2厘米，宽约1.4厘米，鳞盾肥厚、隆起或微隆起，扁菱形或菱状多角形，横脊显著，鳞脐凸起有尖刺；种子卵圆形或长卵圆形，淡褐色有斑纹，长6-8毫米，径4-5毫米，连翅长1.5-1.8厘米；子叶8-12枚，长3.5-5.5厘米；初生叶窄条形，长约4.5厘米，先端尖，边缘有细锯齿
生态习性:
  产地: 吉林南部、辽宁、河北、河南、山东、山西、内蒙古、陕西、甘肃、宁夏、青海及四川等省区
  特有: 为我国特有树种
  生境: 多组成单纯林；辽宁、山东、河北、山西、陕西等省有人工林；为喜光、深根性树种，喜干冷气候，在土层深厚、排水良好的酸性、中性或钙质黄土上均能生长良好
  海拔: 100-2600m
  物候: 花期4~5月，球果第二年10月成熟
功用价值:
  经济价值: 心材淡黄红褐色，边材淡黄白色，纹理直，结构较细密一，材质较硬，比重0.4-0.54，富树脂，耐久用。可供建筑、电杆、矿柱、造船、器具、家具及木纤维 工业等用材。树干可割取树脂，提取松节油；树皮可提取栲胶。松节、松针（即针叶）、花粉均供药用。
  植物文化: '《赠从弟（其二）》

    魏晋 刘桢

    亭亭山上松，瑟瑟谷中风；

    风声一何盛，松枝一何劲！

    冰霜正惨凄，终岁常端正；

    岂不罹凝寒？松柏有本性

    刘桢的诗刚劲挺拔，卓荦不凡，曹丕称“其五言诗之善者，妙绝时人”；《赠从弟》共三首，为其代表作，尤以第二首著称于世，貌似咏物，实为言志，借青松之刚劲，明志向之坚贞；全诗由表及里，由此及彼，寓意高远，气壮脱俗；'
