学名: Humulus scandens (Lour.) Merr.
中文名: 葎草
俗名:
- 锯锯藤
- 拉拉藤
- 葛勒子秧(gé lè zǐ yāng)
- 勒草(lè cǎo)
- 拉拉秧
- 割人藤
- 拉狗蛋
异名:
- Antidesma scandens
- Humulus japonicus
- Humulopsis scandens
描述: 多年生缠绕草本，茎、枝、叶柄密生倒钩刺。叶对生，掌状5–7深裂，边缘具粗锯齿。花单性异株，雄花圆锥花序，雌花穗状。果穗绿色，瘦果淡黄色。花期5–8月，果期8–9月。我国各地广布。生于路旁、荒地、田间，为常见杂草，全草可入药，清热利湿、解毒消肿，亦可作饲料。
分类系统:
  界: Plantae-植物界(zhí wù jiè)
  门: Tracheophyta-维管植物门(wéi guǎn zhí wù mén)
  纲: Magnoliopsida-木兰纲(mù lán gāng)
  目: Rosales-蔷薇目(qiáng wēi mù)
  科: Cannabaceae-大麻科(dà má kē)
  属: Humulus-葎草属(lǜ cǎo shǔ)
物种保护: 暂无数据
分类信息: 暂无数据
形态特征:
  生活型: 缠绕草本，茎、枝、叶柄均具倒钩刺
  茎: 茎、枝、叶柄均具倒钩刺
  叶: 叶纸质，肾状五角形，掌状5-7深裂，稀3裂，长宽均7-10厘米，基部心形，上面疏被糙伏毛，下面被柔毛及黄色腺体，裂片卵状三角形，具锯齿；叶柄长5-10厘米
  花: 雄花小，黄绿色，花序长15-25厘米；雌花序径约5毫米，苞片纸质，三角形，被白色绒毛；子房为苞片包被，柱头2，伸出苞片外
  果: 瘦果成熟时露出苞片外
生态习性:
  产地: 我国除新疆、青海外，南北各省区均
  分布: 日本、越南
  生境: 沟边、荒地、废墟、林缘边
  物候: 花期春夏，果期秋季
功用价值: 暂无数据
植物志: '1.葎草（唐本草）勒草（名医别录），葛勒子秧（救荒本草），拉拉藤（江苏、浙江），锯锯藤（四川、江西）图版57：5-7

  Humulus scandens (Lour.) Merr. in Trans. Amer. Philip. Soc. n. ser. 24. -2: 138. 1935; 中国高等植物图鉴1: 502. f. 1004. 1972; 台湾植物志2: 157. 1976; 云南植物志1: 158.1977. ——Antidesma scandens Lour. Fl. Cochinch. 2: 157. 1790.——HumuluS japonicus Sieb. et Zucc. Fl. Japan Fam. Nat. 2: 89. 1849.

  缠绕草本，茎、枝、叶柄均具倒钩刺。叶纸质，肾状五角形，掌状5-7深裂稀为3裂，长宽约7-10厘米，基部心脏形，表面粗糙，疏生糙伏毛，背面有柔毛和黄色腺体，裂片卵状三角形，边缘具锯齿；叶柄长5-10厘米。雄花小，黄绿色，圆锥花序，长约15-25厘米；雌花序球果状，径约5毫米，苞片纸质，三角形，顶端渐尖，具白色绒毛；子房为苞片包围，柱头2，伸出苞片外。瘦果成熟时露出苞片外。花期春夏，果期秋季。

  我国除新疆、青海外，南北各省区均有分布。常生于沟边、荒地、废墟、林缘边。日本、越南也有。

  本草可作药用，茎皮纤维可作造纸原料，种子油可制肥皂，果穗可代啤酒花H. lupulus用。'
