形态特征:
  生活型: 一年生草本
  株: 高5-20厘米
  茎: 茎多分枝，匍匐状，微被蛛丝状毛或无毛
  叶: 叶楔状倒披针形，长0.7-1.8厘米，先端钝，基部楔形，边缘有少数锯齿，无毛或下面微被蛛丝状毛
  花: 头状花序小，扁球形，花序梗无或极短；总苞半球形，总苞片2层，椭圆状披针形，绿色，边缘透明膜质，外层较大；边花雌性，多层，花冠细管状，淡绿黄色，2-3微裂；盘花两性，花冠管状，4深裂，淡紫红色，下部有明显的窄管
  果: 瘦果椭圆形，具4棱，棱有长毛，无冠状冠毛
