植物志: 'SYN 注：学名已修订，接受名为Cosmos bipinnatus。

  1. 秋英（广州常见经济植物）大波斯菊（植物学大辞典），波斯菊（华北习见观赏植物）图版62：1-3

  Cosmos bipinnata Cav., Ic. et Descr. Pl. 1: 10. t. 14. 1791; Loes. in Beih. Bot. Centralbl. 37, 2: 192. 1919; 侯宽昭等, 广州植物志 544. 1956; 裴鉴等, 江苏南部种子植物手册 769. 图1239. 1959.

  一年生或多年生草本，高1-2米。根纺锤状，多须根，或近茎基部有不定根。茎无毛或稍被柔毛。叶二次羽状深裂，裂片线形或丝状线形。头状花序单生，径3-6厘米；花序梗长6-18厘米。总苞片外层披针形或线状披针形，近革质，淡绿色，具深紫色条纹，上端长狭尖，较内层与内层等长，长10-15毫米，内层椭圆状卵形，膜质。托片平展，上端成丝状，与瘦果近等长。舌状花紫红色，粉红色或白色；舌片椭圆状倒卵形，长2-3厘米，宽1.2-1.8厘米，有3-5钝齿；管状花黄色，长6-8毫米，管部短，上部圆柱形，有披针状裂片；花柱具短突尖的附器。瘦果黑紫色，长8-12毫米，无毛，上端具长喙，有2-3尖刺。花期6-8月，果期9-10月。

  此著名的观赏植物原产美洲墨西哥，在我国栽培甚广，在路旁、田埂、溪岸也常自生。云南、四川西部有大面积归化，海拔可达2700米。此外，在我国栽培的还有黄秋英 C. sulphureus Cav., 亦称硫磺菊（广州常见经济植物），它的特点是：舌状花金黄色或橘黄色；叶2-3次羽状深裂，裂片较宽，披针形至椭圆形；瘦果有粗毛，连同喙长达18-25毫米，喙纤弱，花期7-8月。原产墨西哥至巴西。在云南西南、南部常见归化，海拔500-1500米。'
