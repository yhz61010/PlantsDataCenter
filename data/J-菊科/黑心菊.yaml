学名: Rudbeckia hirta L.
中文名: 黑心菊
俗名:
- 黑心金光菊(hēi xīn jīn guāng jú)
- 黑眼菊(hēi yǎn jú)
异名: 无
描述: 暂无数据
分类系统:
  界: Plantae-植物界(zhí wù jiè)
  门: Tracheophyta-维管植物门(wéi guǎn zhí wù mén)
  纲: Magnoliopsida-木兰纲(mù lán gāng)
  目: Asterales-菊目(jú mù)
  科: Asteraceae-菊科(jú kē)
  属: Rudbeckia-金光菊属(jīn guāng jú shǔ)
物种保护: 暂无数据
分类信息:
  分类讨论: 本种变异极大，叶从全缘至具细或粗齿，Rudbeckia serotina Nutt. 仅是其中一个叶全缘或近全缘的变型，现被归入本种之变种黑眼菊（R. hirta L. var. pulcherrima Farw.）
形态特征:
  生活型: 一年生或二年生草本，一说二年生或有限多年生草本（FNA）
  株: 全株被刺毛
  茎: 茎密被硬毛，茎于基部或近中部至中高部(原变种)分支
  叶: 叶柄具翅，下部叶长卵圆形、长圆形或匙形，8-12厘米，基部楔形下延，3出脉，边缘有细锯齿，上部叶长圆状披针形，长3-5厘米，两面被白色密刺毛，边缘有疏齿或全缘，无柄或具短柄
  花: 头状花序径5-7厘米，花序梗长；总苞片外层长圆形，长1.2-1.7厘米，内层披针状线形，被白色刺毛；花托圆锥形，托片线形，对折呈龙骨瓣状，长约5毫米，边缘有纤毛；舌状花鲜黄色，舌片长圆形，10-14个，长2-4厘米，先端有2-3不整齐短齿；管状花褐紫或黑紫色
  果: 瘦果四棱形，黑褐色，约2mm，无冠毛
生态习性:
  分布: 原产北美，我国客地庭园常见栽培、供观赏
功用价值: 暂无数据
植物志: '2. 黑心金光菊 黑眼菊（江苏南部种子植物手册）图版58: 6-9

  Rudbeckia hirta L., Sp. Pl. 907. 1753; DC., Prodr, 5: 556. 1836; Britton et Brown, Ill. Fl. North. Unit. Stat. 3: 416. 1877; 裴鉴等, 江苏南部种子植物手册, 764. 图1229. 1959. ——Rudbeckia serotina Nutt. in Journ. Acad. Philed. 7: 80.

  一年或二年生草本，高30-100厘米。茎不分枝或上部分枝，全株被粗刺毛。下部叶长卵圆形，长圆形或匙形，顶端尖或渐尖，基部楔状下延，有三出脉，边缘有细锯齿，有具翅的柄，长8-12厘米；上部叶长圆披针形，顶端渐尖，边缘有细至粗疏锯齿或全缘，无柄或具短柄，长3-5厘米，宽1-1.5厘米，两面被白色密刺毛。头状花序径5-7厘米，有长花序梗。总苞片外层长圆形，长12-17毫米；内层较短，披针状线形，顶端钝，全部被白色刺毛。花托圆锥形；托片线形，对折呈龙骨瓣状，长约5毫米，边缘有纤毛。舌状花鲜黄色；舌片长圆形，通常10-14个，长20-40毫米，顶端有2-3个不整齐短齿。管状花暗褐色或暗紫色。瘦果四棱形，黑褐色，长2毫米，无冠毛。

  原产北美，我国客地庭园常见栽培、供观赏。本种变异极大，叶从全缘至具细或粗齿，R. serotina Nutt. 仅是其中一个叶全缘或近全缘的变型。'
