形态特征:
  生活型: 一年生或二年生草本
  茎: 茎下部被长硬毛，上部被上弯短硬毛
  叶: 基部叶长圆形或宽卵形，稀近圆形，长4-17厘米，基部窄成具翅长柄，具粗齿；下部茎生叶与基部叶同形，叶柄较短；中部和上部叶长圆状披针形或披针形，长1-9厘米，具短柄或无柄，有齿或近全缘；最上部叶线形；叶边缘被硬毛，两面被疏硬毛或近无毛
  花: 头状花序数个或多数，排成疏圆锥花序，总苞半球形，总苞片3层，披针形，淡绿色或多少褐色，背面密被腺毛和疏长毛：外围雌花舌状，2层，长6-8毫米，管部长1-1.5毫米，上部被疏微毛，舌片平展，白色或淡天蓝色，线形，宽0.6毫米，先端具2小齿；中央两性花管状，黄色，管部长约0.5毫米，檐部近倒锥形，裂片无毛；瘦果披针形，长约1.2毫米，扁，被疏贴柔毛；冠毛异形，雌花冠毛极短，小冠腺质鳞片结合成环状，两性花冠毛2层，外层鳞片状，内层为10-15刚毛
