学名: Juniperus chinensis L.
中文名: 圆柏
俗名:
- 珍珠柏
- 红心柏
- 刺柏
- 桧
- 桧柏
异名:
- Sabina chinensis
- Juniperus cabiancae
- Sabina sphaerica
- Juniperus cernua
- Juniperus virginica
- Juniperus barbadensis
- Sabina cabiancae
- Juniperus sphaerica
- Juniperus flagelliformis
- Sabina dimorpha
- Juniperus dimorpha
- Juniperus sinensis
- Juniperus thunbergii
- Juniperus fortunei
- Juniperus chinensis var. pendula
描述: 常绿乔木，高可达20米。树皮灰褐色，成条片开裂。幼树叶刺形，大树叶鳞形。雌雄异株，球果近球形，熟时暗褐色，被白粉。花期4月，球果翌年10–11月成熟。我国各地广布。树姿优美，耐修剪，为著名园林、盆景、绿篱树种，材质致密，可供工艺品、家具用材。
分类系统:
  界: Plantae-植物界(zhí wù jiè)
  门: Tracheophyta-维管植物门(wéi guǎn zhí wù mén)
  纲: Pinopsida-松纲(sōng gāng)
  目: Cupressales-柏目(bǎi mù)
  科: Cupressaceae-柏科(bǎi kē)
  属: Juniperus-刺柏属(cì bǎi shǔ)
物种保护: 暂无数据
分类信息: 暂无数据
形态特征:
  生活型: 乔木
  株: 常雌雄异株，种子卵圆形
  茎: 树皮深灰色，纵裂，成条片开裂；幼树的枝条通常斜上伸展，形成尖塔形树冠，老则下部大枝平展，形成广圆形的树冠；树皮灰褐色，纵裂，裂成不规则的薄片脱落
  枝: 小枝通常直或稍成弧状弯曲，生鳞叶的小枝近圆柱形或近四棱形，径1-1.2毫米
  叶: 叶二型，刺叶生于幼树之上，老龄树则全为鳞叶，壮龄树兼有刺叶与鳞叶
  花: 雌雄异株，稀同株，雄球花黄色，椭圆形，长2.5-3.5毫米，雄蕊5-7对，常有3-4花药
  果: 球果近圆球形，径6-8毫米，两年成熟，熟时暗褐色，被白粉或白粉脱落，有1-4粒种子；种子卵圆形，扁，顶端钝，有棱脊及少数树脂槽；子叶2枚，出土，条形，长1.3-1.5厘米，宽约1毫米，先端锐尖，下面有两条白色气孔带，上面则不明显
生态习性:
  产地: 内蒙古乌拉山、河北、山西、山东、江苏、浙江、福建、安徽、江西、河南、陕西南部、甘肃南部、四川、湖北西部、湖南、贵州、广东、广西北部及云南等地
  分布: 朝鲜、日本
  生境: 中性土、钙质土及微酸性土上，各地亦多栽培，西藏也有栽培
  物候: 花期4月，翌年11月果熟
  栽培: 喜光树种，喜温凉、温暖气候及湿润土壤；在华北及长江下游海拔500m以下，中上游海拔1000m以下排水良好之山地可选用造林
功用价值:
  经济价值: 心材淡褐红色，边材淡黄褐色，有香气，坚韧致密，耐腐力强；可作房屋建筑、家具、文具及工艺品等用材；树根、树干及枝叶可提取柏木脑的原料及柏木油；枝叶入药，能祛风散寒，活血消肿、利尿；种子可提润滑油；为普遍栽培的庭园树种
  植物文化: 圆柏称桧，自古已然；公元之前，中国古籍中便有桧（圆柏）的公布、利用、栽培的记载；3000多年前，中原、淮扬、江汉等地圆柏多有著名的大材，西周分封的诸侯国中，便有因之将圆柏作为国名，称为“桧”（《诗·桧风》）；五帝尧舜之时，上之所求于下谓下赋，下之所纳于上谓之贡
  诗词歌赋: '《桧》 ——苏轼【宋】

    强致南山树，来经渭水滩；

    生成未有意，鸦鹊莫相干；


    桧树 ——秦韬玉 【唐】

    翠云交干瘦轮囷，啸雨吟风几百春；

    深盖屈盘青麈尾，老皮张展黑龙鳞；

    唯堆寒色资琴兴，不放秋声染俗尘；

    岁月如波事如梦，竟留苍翠待何人'
植物志: 'SYN 注：学名已修订，接受名为Juniperus chinensis。

  Sabina chinensis (Linn.) Ant. var. chinensis 图版80: 6-8

  乔木，高达20米，胸径达3.5米；树皮深灰色，纵裂，成条片开裂；幼树的枝条通常斜上伸展，形成尖塔形树冠，老则下部大枝平展，形成广圆形的树冠；树皮灰褐色，纵裂，裂成不规则的薄片脱落；小枝通常直或稍成弧状弯曲，生鳞叶的小枝近圆柱形或近四棱形，径1-1.2毫米。叶二型，即刺叶及鳞叶；刺叶生于幼树之上，老龄树则全为鳞叶，壮龄树兼有刺叶与鳞叶；生于一年生小枝的一回分枝的鳞叶三叶轮生，直 伸而紧密，近披针形，先端微渐尖，长2.5-5毫米，背面近中部有椭圆形微凹的腺体；刺叶三叶交互轮生，斜展，疏松，披针形，先端渐尖，长6-12毫米，上面微凹，有两条白粉带。雌雄异株，稀同株，雄球花黄色，椭圆形，长2.5-3.5毫米，雄蕊5-7对，常有3-4花药。球果近圆球形，径6-8毫米，两年成熟，熟时暗褐色，被白粉或白粉脱落，有1-4粒种子；种子卵圆形，扁，顶端钝，有棱脊及少数树脂槽；子叶2枚，出土，条形，长1.3-1.5厘米，宽约1毫米，先端锐尖，下面有两条白色气孔带，上面则不明显。

  产于内蒙古乌拉山、河北、山西、山东、江苏、浙江、福建、安徽、江西、河南、陕西南部、甘肃南部、四川、湖北西部、湖南、贵州、广东、广西北部及云南等地。生于中性土、钙质土及微酸性土上，各地亦多栽培，西藏也有栽培。朝鲜、日本也有分布。

  心材淡褐红色，边材淡黄褐色，有香气，坚韧致密，耐腐力强。可作房屋建筑、家具、文具及工艺品等用材；树根、树干及枝叶可提取柏木脑的原料及柏木油；枝叶入药，能祛风散寒，活血消肿、利尿；种子可提润滑油；为普遍栽培的庭园树种。

  喜光树种，喜温凉、温暖气候及湿润土壤。在华北及长江下游海拔500米以下，中上游海拔1000米以下排水良好之山地可选用造林。

