学名: Sorbaria kirilowii (Regel & Tiling) Maxim.
中文名: 华北珍珠梅
俗名:
- 珍珠梅
- 吉氏珍珠梅
异名:
- Spiraea kirilowii
- Sorbaria sorbifolia var. kirilowii
描述: 暂无数据
分类系统:
  界: Plantae-植物界(zhí wù jiè)
  门: Tracheophyta-维管植物门(wéi guǎn zhí wù mén)
  纲: Magnoliopsida-木兰纲(mù lán gāng)
  目: Rosales-蔷薇目(qiáng wēi mù)
  科: Rosaceae-蔷薇科(qiáng wēi kē)
  属: Sorbaria-珍珠梅属(zhēn zhū méi shǔ)
物种保护:
  濒危等级: 无危(LC)
分类信息: 暂无数据
形态特征:
  生活型: 灌木
  株: 高达3米
  枝: 小枝无毛；冬芽近无毛
  叶: 羽状复叶具小叶13-21，连叶柄长21-25厘米；小叶披针形至长圆状披针形，长4-7厘米，先端渐尖，稀尾尖，有尖锐重锯齿，两面无毛或下面脉腋具短柔毛，侧脉15-23对，近平行：小叶柄短或近无柄，无毛，托叶线状披针形，无毛
  花: 圆锥花序密集，径7-11厘米，无毛，微被白粉；花梗长3-4毫米；苞片线状披针形，全缘：花径5-7毫米：被丝托钟状，无毛，萼片长圆形，无毛：花瓣白色，倒卵形或宽卵形，长4-5毫米；雄蕊20，与花瓣等长或稍短；花盘圆盘状；心皮5，花柱稍短于雄蕊
  果: 蓇葖果长圆柱形，无毛，长约3毫米，花柱稍侧生，宿存萼片反折，稀开展；果柄直立
生态习性:
  产地: 河北、河南、山东、山西、陕西、甘肃、青海、内蒙古
  生境: 山坡阳处、杂木林中
  海拔: 200-1300m
  物候: 花期6-7月，果期9-10月
功用价值:
  经济价值: 华北各地常见栽培供观赏
植物志: '2. 华北珍珠梅　吉氏珍珠梅（经济植物手册），珍珠梅（中国高等植物图鉴）　图版1: 3-6

  Sorbaria kirilowii (Regel) Maxim. in Acta Hort. Petrop. 6: 225. 1879; Schneid. Ill. Handb. Laubh. 1: 486. f. 297 p-q. 299 d. 1905; Rehd. in Journ. Arn. Arb. 5: 173. 1924; Liu in Bull. Pek. Soc. Nat. Hist. 2: 111. 1927; 裴鉴等, 江苏南部种子植物手册 376. 图596. 1959; 北京师范大学, 北京植物志上册 384. 图329. 1962; 中国高等植物图鉴 2: 186. 图2102. 1972. ——Spiraea kirilowii Regel in Regel & Tiling, Fl. Ajan. 81. 1858. in adnot.; Franch. in Nouv. Arch. Mus. Hist. Nat. Paris ser. 2. 5: 260. 1883. ——Sorbaria sorbifolia (L.) A. Br. var. kirilowii Ito in Bot. Mag. Tokyo 14: 116. 1900. ——Spiraea sorbifolia auct. non L. 1753: Bge. Mem. Div. Sav. Acad. Sci. St. Petersb. 2: 97. 1833. ——Sorbaria sorbifolia auct. non A. Br. 1864: Limpricht in Fedde, Repert. Sp. Nov. Beih. 12: 404. 1922. quoad Pl. e Chili.; Hers in Journ. N. China Branch Roy. Asiat. Soc. 53: 116. 1922 & Liste Ess. Lign. Honan. 29. 1922.

  灌木，高达3米，枝条开展；小枝圆柱形，稍有弯曲，光滑无毛，幼时绿色，老时红褐色；冬芽卵形，先端急尖，无毛或近于无毛，红褐色。羽状复叶，具有小叶片13-21，连叶柄在内长21-25厘米，宽7-9厘米，光滑无毛；小叶片对生，相距1.5-2厘米，披针形至长圆披针形，长4-7厘米，宽1.5-2厘米，先端渐尖，稀尾尖，基部圆形至宽楔形，边缘有尖锐重锯齿，上下两面均无毛或在脉腋间具短柔毛，羽状网脉，侧脉15-23对近平行，下面显著；小叶柄短或近于无柄，无毛；托叶膜质，线状披针形，长8-15毫米，先端钝或尖，全缘或顶端稍有锯齿，无毛或近于无毛。顶生大型密集的圆锥花序，分枝斜出或稍直立，直径7-11厘米。长15-20厘米，无毛，微被白粉；花梗长3-4毫米；苞片线状披针形，先端渐尖，全缘，长2-3毫米；花直径5-7毫米；萼筒浅钟状，内外两面均无毛；萼片长圆形，先端圆钝或截形，全缘，萼片与萼筒约近等长；花瓣倒卵形或宽卵形，先端圆钝，基部宽楔形，长4-5毫米，白色；雄蕊20，与花瓣等长或稍短于花瓣，着生在花盘边缘；花盘圆杯状；心皮5，无毛，花柱稍短于雄蕊。蓇葖果长圆柱形，无毛，长约3毫米，花柱稍侧生，向外弯曲：萼片宿存，反折，稀开展；果梗直立。花期6-7月，果期9-10月。

  产河北、河南、山东、山西、陕西、甘肃、青海、内蒙古。生于山坡阳处、杂木林中，海拔200-1300米。

  华北各地常见栽培供观赏。'
