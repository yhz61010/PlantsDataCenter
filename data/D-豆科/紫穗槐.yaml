形态特征:
  生活型: 落叶灌木
  茎: 茎丛生，高1-4米
  枝: 小枝幼时密被短柔毛，后渐变无毛
  叶: 奇数羽状复叶长10-15厘米；叶柄长1-2厘米；托叶线形，脱落；小叶11-25片，卵形或椭圆形，长1-4厘米，先端圆、急尖或微凹，有短尖，基部宽楔形或圆，上面无毛或疏被毛，下面被白色短柔毛和黑色腺点
  花: 穗状花序顶生或生于枝条上部叶腋，长7-15厘米，花序梗与序轴均密被短柔毛；花多数，密生；花萼钟状，长2-3毫米，疏被毛或近无毛，萼齿5，三角形，近等长，长约为萼筒的1/3；花冠紫色，旗瓣心形，长6-7毫米，先端裂至瓣片的1/3，基部具短瓣柄，翼瓣与龙骨瓣均缺如；雄蕊10，花丝基部合生，与子房同包于旗瓣之中，成熟伸出花冠之外；子房无柄，花柱被毛
  果: 荚果长圆形，下垂，长0.6-1厘米，微弯曲，具小突尖，成熟时棕褐色，有疣状腺点
生态习性:
  产地: 本种原产美国东北部和东南部，系多年生优良绿肥，蜜源植物，耐瘠，耐水湿和轻度盐碱土，又能固氮；现我国东北、华北、西北及山东、安徽、江苏、河南、湖北、广西、四川等省区均有栽培
功用价值: 暂无数据
植物志: '1. 紫穗槐 椒条、棉条（东北木本植物图志），棉槐、紫槐、槐树（江苏植物志）图版83: 9-15

  Amorpha fruticosa Linn. Sp. Pl, 713. 1753;中国主要植物图说·豆科263. 图360. 1955; 中国高等植物图鉴2: 391. 图2511. 1972.

  落叶灌木，丛生，高1-4米。小枝灰褐色，被疏毛，后变无毛，嫩枝密被短柔毛。叶互生，奇数羽状复叶，长10-15厘米，有小叶11-25片，基部有线形托叶；叶柄长1-2厘米；小叶卵形或椭圆形，长1-4厘米，宽0.6-2.0厘米，先端圆形，锐尖或微凹，有一短而弯曲的尖刺，基部宽楔形或圆形，上面无毛或被疏毛，下面有白色短柔毛，具黑色腺点。穗状花序常1至数个顶生和枝端腋生，长7-15厘米，密被短柔毛；花有短梗；苞片长3-4毫米；花萼长2-3毫米，被疏毛或几无毛，萼齿三角形，较萼筒短；旗瓣心形，紫色，无翼瓣和龙骨瓣；雄蕊10，下部合生成鞘，上部分裂，包于旗瓣之中，伸出花冠外。荚果下垂，长6-10毫米，宽2-3毫米，微弯曲，顶端具小尖，棕褐色，表面有凸起的疣状腺点。花、果期5-10月。

  本种原产美国东北部和东南部，系多年生优良绿肥，蜜源植物，耐瘠，耐水湿和轻度盐碱土，又能固氮。现我国东北、华北、西北及山东、安徽、江苏、河南、湖北、广西、四川等省区均有栽培。

  枝叶作绿肥、家畜饲料；茎皮可提取栲胶，枝条编制篓筐；果实含芳香油，种子含油率10%，可作油漆、甘油和润滑油之原料。栽植于河岸、河堤、沙地、山坡及铁路沿线，有护堤防沙、防风固沙的作用。'
