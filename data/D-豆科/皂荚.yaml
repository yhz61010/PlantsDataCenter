学名: Gleditsia sinensis Lam.
中文名: 皂荚
俗名:
- 皂
- 牙皂
- 猪牙皂
- 皂荚树
- 皂角
- 三刺皂角
异名:
- Gleditsia horrida
- Gleditsia macracantha
- Gleditsia japonica
- Gleditsia sinensis var. inermis
- Gleditsia sinensis var. nana
- Gleditsia sinensis var. purpurea
