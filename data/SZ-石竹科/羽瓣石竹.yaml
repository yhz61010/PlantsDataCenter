学名: Dianthus plumarius L.
中文名: 羽瓣石竹
俗名:
- 常夏石竹
异名: 无
描述: 暂无数据
分类系统:
  界: Plantae-植物界(zhí wù jiè)
  门: Tracheophyta-维管植物门(wéi guǎn zhí wù mén)
  纲: Magnoliopsida-木兰纲(mù lán gāng)
  目: Caryophyllales-石竹目(shí zhú mù)
  科: Caryophyllaceae-石竹科(shí zhú kē)
  属: Dianthus-石竹属(shí zhú shǔ)
物种保护: 暂无数据
分类信息: 暂无数据
形态特征:
  生活型: 多年生草本，株高20-30cm，茎丛生，被白粉
  株: 株高20-30cm
  茎: 茎丛生，被白粉
  叶: 叶线形，长3-8cm，先端急尖，边缘粗糙或有细锯齿，叶上面中脉明显，侧脉不明显
  花: 花2-4朵成聚伞花序状，顶生，芳香；花瓣蔷薇色或淡红色，具环纹或花心紫黑色
生态习性:
  分布: 原产欧洲、我国引种栽培
  物候: 花期5-7月
  栽培: 喜温凉及阳光充足的环境，耐寒、不耐暑热，喜疏松、排水良好的土壤，忌水湿；生长适温15℃-24℃
功用价值:
  经济价值: 本种花量大，色彩艳丽，极美丽，为世界广为栽培的庭园花卉，我国长江流域及以北地区习见栽培，可用于园路边、墙垣边、岩石园或用于花境、花坛等，也可做地被植物
植物志: 暂无数据
