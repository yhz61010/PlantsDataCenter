植物志: '原产我国北方，现在南北普遍生长。生于草原和山坡草地。俄罗斯西伯利亚和朝鲜也有。

  现已广泛栽培。育出许多品种，是很好的观赏花卉。根和全草入药，清热利尿，破血通经，散瘀消肿。

  4. 石竹（群芳谱）

  Dianthus chinensis L., Sp. Pl. 411. 1753; Ser. in DC. Prodr. 1: 359. 1824; Bge. , Enum. Pl. Chin. Bor. Coll. 82. 1833; Rohrb. in Linnaea 36: 670. 1870; Forbes et Hemsl. in Journ. Linn. Soc. Bot. 23: 63. 1886; Maxim. , Enum. Pl. Mongol. 84. 1889; Williams in Journ. Linn. Soc. Bot. 29: 429. 1893 (D. sinensis) ; Gilg in Engl. ''s Bot. Jahrb. 34. (Beibl. 75): 33. 1904; Limpr. in Fedde, Repert. Sp. Nov. Beih. 12: 363. 1922; C. P''ei in Contr. Biol. Lab. Sci. Soc. China Bot. ser. 8 (2): 98. 1932; Schischk. in Kom. Fl. USSR 6: 823. 1936; Kitagawa, Lineam. Fl. Mansh. 197. 1939; Bailey, Man. Cult. Pl. 375. 1949; 广州植物志129. 1956; 江苏南部种子植物手册267.图419. 1959; 北京植物志 上册247.图190. 1962;中国高等植物图鉴1: 645.图1289. 1972; 秦岭植物志1 (2): 216. 1974; 东北草本植物志3: 46.图版19.图1-4. 1975; 中国高等植物图鉴补编1: 335. 1982. ——D. chinensis L. f. ignescens (Nakai) Kitagawa in Journ. Jap. Bot. 34: 5. 1959; 东北草本植物志3: 49. 1975.——D. chinensis L. var. ignescens Nakai in Rep. First Sci. Exped. Manch. sect. 4 (2): 15. 1935. ——D. sequieri Chaix in Vill. Fl. Dauph. 1: 330. 1786; Ledeb., Fl. Ross. 1: 277. 1842; Regel, Tent. Fl. Ussur. n. 81. 1861; Maxim., Fl. Asiae. Orient. Fragm. 6. 1879; Franch., Pl. David. 1: 45. 1884; Korsh. in Act. Hort. Petrop. 12: 312. 1891. ——D. sequieri Chaix var. dentosus (Fisch. ex Reichb.) Franch., Pl. David. 1: 46. 1884. ——D. fischeri Spreng. , Cat. Sem. Hort. Hol. 1810; Bge. , Enum. Pl. Chin. Bor. Coll. 82. 1833. ——D. amurensis Jacq. in Journ. Soc. Imp. Centr. Hort. 7: 625. 1861; 中国高等植物图鉴1: 644.图1288. 1972. ——D. dentosus Fisch. ex Reichb. , Pl. Crit. 6: 32. tad. 546. 1828; Ledeb. , Fl. Ross. 1: 278. 1842; Maxim. in Mem. Acad. Sci. St. Petersb. Sav. Etrang. 9: 52 (Prim. Fl. Amur.) 1859; Fr. Schmidt, Reisen Amurl. n. 67. 1868.——D. chinensis L. var. dentosus (Fisch. ex Reichb.) Debx. in Act. Soc. Linn. Bord. 31: 124. 1876. (Fl. Tchef.) ——D. chinensis L. var. macrosepalus Franch. ex Bailey, Cyclop. 1: 1000. 1900.

  4a. 石竹（原变种） 图版108: 1-6

  var. chinensis

  多年生草本，高30-50厘米，全株无毛，带粉绿色。茎由根颈生出，疏丛生，直立，上部分枝。叶片线状披针形，长3-5厘米，宽2-4毫米，顶端渐尖，基部稍狭，全缘或有细小齿，中脉较显。花单生枝端或数花集成聚伞花序；花梗长1-3厘米；苞片4，卵形，顶端长渐尖，长达花萼1/2以上，边缘膜质，有缘毛；花萼圆筒形，长15-25毫米，直径4-5毫米，有纵条纹，萼齿披针形，长约5毫米，直伸，顶端尖，有缘毛；花瓣长16-18毫米，瓣片倒卵状三角形，长13-15毫米，紫红色、粉红色、鲜红色或白色，顶缘不整齐齿裂，喉部有斑纹，疏生髯毛；雄蕊露出喉部外，花药蓝色；子房长圆形，花柱线形。蒴果圆筒形，包于宿存萼内，顶端4裂；种子黑色，扁圆形。花期5-6月，果期7-9月。

  原产我国北方，现在南北普遍生长。生于草原和山坡草地。俄罗斯西伯利亚和朝鲜也有。

  现已广泛栽培。育出许多品种，是很好的观赏花卉。根和全草入药，清热利尿，破血通经，散瘀消肿。

  4b. 兴安石竹（变种）（东北植物检索表） 北石竹（东北药用植物志）

  var. versicolor (Fisch. ex Link) Y. C. Ma in Fl. Intramongol. 2: 191. tab. 101. fig. 1-3. 1978; 河北植物志1: 422. 1986, sphalm. ut f. versicolor.——D. versicolor Fisch. ex Link, Enum. Pl. Hort. Bot. Berol. 1: 420. 1821; 东北草本植物志3: 49. 图版18.图3-5. 1975; 中国沙漠植物志1: 465.图版170.图3-5. 1985.

  植株多少密丛生。茎多少被短糙毛或近无毛而粗糙。叶通常粗糙，斜上，叶片线状披针形至线形，长3-5厘米，宽2-4毫米。

  产东北、内蒙古、河北（西北部）。生于草原、草甸草原、山地草甸、林缘沙地、山坡灌丛及石砬子上。俄罗斯、蒙古也有。模式标本采自俄罗斯。

  全草入药，有清热、利尿、破血通经功效。也可作农药，能杀虫。

  4c. 钻叶石竹（变种）蒙古石竹（东北药用植物志），丝叶石竹（东北植物检索表）

  var. subulifolius (Kitagawa) Y. C. Main Fl. Intramongol. 2: 191. tab. 101. fig. 4. 1978; ——D. subulifolius Kitagawa in Rep. First Sci. Exped. Manch. Sect. 4 (2): 16. tab. 5. 1935. ——D. versicolor Fisch. ex Link var. subulifolius (Kitagawa) Y. C. Chu in Fl. Pl. Herb. Chin. Bor. -Orient. 3: 50. tab. 18. fig. 6-7. 1975; 中国沙漠植物志1: 466. 1985. incl. f. leucopetalus (Kitagawa) Y. C. Chu in Fl. Pl. Herb. Chin. Bor. -Orient. 3: 50. 1975; ——D. subulifolius Kitagawa f. leucopetalus Kitagawa in Rep. First Sci. Exped. Manch. Sect. 4 (2): 17. 1935.

  茎纤细，多数，丛生。叶片线状钻形，斜向上，长1.5-3厘米，宽1-2毫米。花较小。

  产东北、内蒙古。生于固定沙丘、草原沙质地、森林草原、干山坡及山坡石砬子。模式标本采自内蒙古翁牛特旗（乌丹）。

  4d. 高山石竹（变种）（东北植物检索表）

  var. morii (Nakai) Y. C. Chu in Fl. Pl. Herb. Chin. Bor. -Orient. 3: 49. tab. 19. fig. 7. 1975——D. morii Nakai in Bot. Mag. Tokyo 28: 302. 1914.

  植株高10余厘米，密丛生。叶片线状倒披针形或线状披针形，长1.5-3厘米，宽1.5-2.5毫米，有时带紫色。花单一；苞片顶端渐尖、长渐尖或为叶状，常带紫色；花萼长约1.5厘米，直径5-6毫米，带紫色。

  产吉林长白山。生于高山带瀑布旁及山溪旁湿润地。朝鲜（北部）也有。模式标本采自朝鲜。

  4e. 辽东石竹（变种） 长萼石竹（东北草本植物志）

  var. liaotungensis Y. C. Chu in Fl. Pl. Herb. Chin. Bor. -Orient. 3: 227, 49. tab. 19. fig. 8. 1975.

  茎丛生。叶片线形或线状披针形，宽2-3毫米。苞片椭圆形，比花萼短很多，顶端长凸尖或伸长为钻状，边缘为较宽的白膜质，具蛛丝状白色细睫毛；花萼于花期长23-27毫米，直径4毫米，麦秆绿色，萼齿渐尖。

  产辽宁、山东。生于山沟石砾质地、干山坡。模式标本采自辽宁盖县熊岳城喇嘛洞。

  4f. 长苞石竹（变种） （东北草本植物志）

  var. longisquama Nakai et Kitagawa in Rep. First Sci. Exped. Manch. Sect. 4(1): 23. 1934; 东北草本植物志3: 49.图版19.图5-6. 1975; 河北植物志1: 421. 1986.

  植株高10余厘米。茎及叶绿色，有时带紫色。苞片叶状，线形，渐尖，长3-3.5 (-4.5) 厘米，为花萼1倍或更长。

  产辽宁、河北（东北部）、山东（栽培）。生于山顶沙质地、山坡或高山草甸上。模式标本采自河北雾灵山。

  根及全草均可作瞿麦入药。

  4g. 林生石竹（变种）

  var. sylvaticus Koch, Syn. Pl. Germ. Helv. ed. 1. 96; Rohrb. in Linnaea 36: 671. 1870; Williams in Journ. Linn. Soc. Bot. 29: 430. 1893.

  植株高15-50厘米。叶片线状披针形，一般比节间长，弯柔。茎生单花或少花；苞片叶状，近紧贴，与花萼等长或更长。

  产内蒙古、河北、山西。生于山坡、山谷、溪边。

  4h. 三脉石竹（变种）

  var. trinervis D. Q. Lu in Bull. Bot. Res. 15 (2): 185. fig. (186). 1995.

  茎斜升或直立，高20-35厘米。叶片钻状披针形或钻形，长2-3厘米，宽1-4毫米，具明显3条脉。苞片2对，卵形，具凸尖，为花萼长1/3-1/2。

  产山东泰山及东北部沿海。生于山坡、海边。模式标本采自山东泰山。

