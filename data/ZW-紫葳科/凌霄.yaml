学名: Campsis grandiflora (Thunb.) K. Schum.
中文名: 凌霄
俗名:
- 上树龙
- 五爪龙
- 九龙下海
- 接骨丹
- 过路蜈蚣
- 藤五加
- 搜骨风
- 白狗肠
- 堕胎花(duò tāi huā)
- 苕华(tiáo huá)
- 紫葳(zǐ wēi)
异名:
- Bignonia grandiflora
- Bignonia chinensis
- Tecoma chinensis
- Campsis chinensis
- Campsis adrepens
