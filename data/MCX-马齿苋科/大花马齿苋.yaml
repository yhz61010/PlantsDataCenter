植物志: '3. 大花马齿苋（中国高等植物图鉴） 半支莲（植物学大辞典），松叶牡丹、龙须牡丹、金丝杜鹃、洋马齿苋、太阳花、午时花

  Portulaca grandiflora Hook. in Curtis''s Bot. Mag. 56: pl. 2885. 1829; Cambess. in A. St. Hilaire, Fl. Bras. mer. 2: 192. 1829; v. Poellnitz in Fedde, Repert. Sp. Nov. 37: 264. 1934;中国高等植物图鉴1: 617.图1234. 1972; 秦岭植物志1 (2): 191. 1974; 湖北植物志1: 283.图390. 1976; 台湾植物志2: 316. 1976; 内蒙古植物志2: 156.图版83。图4-5. 1978.

  一年生草本，高10-30厘米。茎平卧或斜升，紫红色，多分枝，节上丛生毛。叶密集枝端，较下的叶分开，不规则互生，叶片细圆柱形，有时微弯，长1-2.5厘米，直径2-3毫米，顶端圆钝，无毛；叶柄极短或近无柄，叶腋常生一撮白色长柔毛。花单生或数朵簇生枝端，直径2.5-4厘米，日开夜闭；总苞8-9片，叶状，轮生，具白色长柔毛；萼片2，淡黄绿色，卵状三角形，长5-7毫米，顶端急尖，多少具龙骨状凸起，两面均无毛；花瓣5或重瓣，倒卵形，顶端微凹，长12-30毫米，红色、紫色或黄白色；雄蕊多数，长5-8毫米，花丝紫色，基部合生；花柱与雄蕊近等长，柱头5-9裂，线形。蒴果近椭圆形，盖裂；种子细小，多数，圆肾形，直径不及1毫米，铅灰色、灰褐色或灰黑色，有珍珠光泽，表面有小瘤状凸起。花期6-9月，果期8-11月。

  原产巴西。我国公园、花圃常有栽培，是一种美丽的花卉，繁殖容易，扦插或播种均可。

  全草可供药用，有散瘀止痛、清热、解毒消肿功效，用于咽喉肿痛、烫伤、跌打损伤、疮疖肿毒。'
