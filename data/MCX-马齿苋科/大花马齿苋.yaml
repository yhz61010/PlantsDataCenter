形态特征:
  生活型: 一年生草本
  株: 高达30厘米
  茎: 茎平卧或斜升，紫红色，多分枝，节有簇生毛
  叶: 叶密集枝顶，较下不规则互生，叶细圆柱形，有时微弯，长1-2.5厘米，径2-3毫米，先端钝圆，无毛；叶柄极短或近无柄，叶腋常簇生白色长柔毛
  花: 花单生或数朵簇生枝顶，径2.5-4厘米，日开夜闭；叶状总苞8-9片，轮生，被白色长柔毛；萼片2，淡黄绿色，卵状三角形，长5-7毫米，稍具龙骨状凸起，无毛；花瓣5或重瓣，倒卵形，先端微凹，长1.2-3厘米，红、紫、黄或白色；雄蕊多数，长5-8毫米，花丝紫色，基部连合；花柱长5-8毫米，柱头5-9，线形
  果: 蒴果近椭圆形，盖裂
  种子: 种子圆肾形，径不及1毫米，深灰、灰褐或灰黑色，有光泽，被小瘤
