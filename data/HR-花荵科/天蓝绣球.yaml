植物志: '1. 天蓝绣球（中国高等植物图鉴）

  Phlox paniculata Linn. Sp. Pl. 151. 1753; Benth. in DC. Prodr. 9: 303. 1845; Brand in Engl. Pflanzenr., 4: 59. 1907;中国高等植物图鉴3: 543. 图5039. 1974. ——P. acuminata Pursh, Fl. Amer. Sept. 2. Suppl. 730. 1814; id. in Curtis''s Bot. Mag. 44: t. 1880. 1817; Benth. in DC. Prodr. 9: 304. 1845. ——P. siebmanni Benth. in DC. Prodr. 9: 303. 1845.

  多年生草本，茎直立，高60-100厘米，单一或上部分枝，粗壮，无毛或上部散生柔毛。叶交互对生，有时3叶轮生，长圆形或卵状披针形，长7.5-12厘米，宽1.5-3.5厘米，顶端渐尖，基部渐狭成楔形，全缘，两面疏生短柔毛；无叶柄或有短柄。多花密集成顶生伞房状圆锥花序，花梗和花萼近等长；花萼筒状，萼裂片钻状，比萼管短，被微柔毛或腺毛；花冠高脚碟状，淡红、红、白、紫等色，花冠筒长达3厘米，有柔毛，裂片倒卵形，圆，全缘，比花冠管短，平展；雄蕊与花柱和花冠等长或稍长。蒴果卵形，稍长于萼管，3瓣裂，有多数种子。种子卵球形，黑色或褐色，有粗糙皱纹。

  原产北美洲东部。我国各地庭园常见栽培。'
