形态特征:
  生活型: 一年生草本
  株: 高达90厘米
  茎: 茎、叶、花梗、萼片被淡黄色刚毛；茎分枝
  叶: 叶披针形或窄卵形，长3-15厘米，二回羽状分裂，下部全裂，裂片披针形再次羽状浅裂，上部深裂或浅裂，裂片披针形，最上部粗齿状羽状浅裂，上面叶脉稍凹；.下部叶具柄，上部叶无柄
  花: 花单生茎枝顶端；花芽下垂；花梗长10-15厘米；萼片2，宽椭圆形，长1-1.8厘米；花瓣4，圆形、宽楠圆形或宽倒卵形，长2.5-4.5厘米，全缘，稀具圆齿或先端缺刻，紫红色，基部常具深紫色斑点；花丝丝状，深紫红色，花药黄色；子房无毛，柱头5-18，辐射状，连成盘状体，边缘具圆齿
  果: 果宽倒卵圆形，长1-2.2厘米，无毛，微具肋
  种子: 种子肾状长圆形
生态习性:
  分布: 原产欧洲，我国各地常见栽培，为观赏植物
  物候: 花期3-8月
