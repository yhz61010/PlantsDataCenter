分类信息:
  分类讨论: 另有栽培品种：癞葡萄（癞瓜） Momordica charantia 'Abbreviata'，为苦瓜的野生变种； 故另写作：Momordica charantia L. var. abbreviata Ser.
形态特征:
  生活型: 一年生攀援状柔弱草本
  茎: 茎、枝被柔毛
  枝: 卷须不分歧，叶柄长4-6厘米；叶卵状肾形或近圆形，长、宽均4-12厘米，5-7深裂，裂片卵状长圆形，具粗齿或有不规则小裂片
  花: 雌花：单生；花梗基部常具1苞片；子房密生瘤状突起
  果: 果纺锤形或圆柱形，多瘤皱，长10-20厘米，成熟后橙黄色，顶端3瓣裂
  种子: 种子多数，具红色假种皮，两端各具3小齿，两面有刻纹
生态习性:
  产地: 广泛栽培于世界热带到温带地区；我国南北均普遍栽培
  物候: 花果期5-10月
