学名: Fraxinus chinensis Roxb.
中文名: 白蜡树
俗名:
- 白蜡杆
- 小叶白蜡
- 速生白蜡
- 新疆小叶白蜡
- 云南梣
- 尖叶梣
- 川梣
- 绒毛梣
- 白蜡
- 梣(cén)
- 青榔木(qīng láng mù)
- 白荆树(bái jīng shù)
异名:
- Fraxinus lingelsheimii
- Fraxinus szaboana
- Fraxinus sargentiana
- Fraxinus velutina Lingelsh.
- Fraxinus medicinalis
- Fraxinus caudata
- Fraxinus yunnanensis
- Fraxinus chinensis var. tomentosa
- Fraxinus chinensis var. rotundata
- Fraxinus chinensis var. acuminata
- Fraxinus rhynchophylla var. huashanensis
描述: 落叶乔木，高10–12米。树皮灰褐色，纵裂。奇数羽状复叶，小叶5–7枚，卵形至披针形，边缘具钝锯齿。圆锥花序顶生或腋生，花小，无花瓣。翅果倒披针形。花期4月，果期8–9月。我国南北各地广布。适应性强，耐水湿，为优良行道树、护岸树、用材树，枝条可编筐，树皮入药为“秦皮”。
分类系统:
  界: Plantae-植物界(zhí wù jiè)
  门: Tracheophyta-维管植物门(wéi guǎn zhí wù mén)
  纲: Magnoliopsida-木兰纲(mù lán gāng)
  目: Lamiales-唇形目(chún xíng mù)
  科: Oleaceae-木犀科(mù xī kē)
  属: Fraxinus-梣属(chén shǔ)
物种保护: 暂无数据
分类信息:
  模式产地: 模式标本采自云南思茅
形态特征:
  生活型: 落叶乔木
  株: 高约15米；树皮淡黄色，粗糙
  茎: 树皮灰褐色，纵裂
  枝: 小枝无毛或疏被长柔毛，旋脱落
  叶: 羽状复叶长12-35厘米；小叶3-7，硬纸质，卵形、长圆形或披针形，长3-12厘米，先端锐尖或渐尖，基部圆纯或楔形，具整齐锯齿，上面无毛，下面延中脉被白色长柔毛或无毛；小叶柄长3-5毫米
  花: 圆锥花序花序轴无毛或被细柔毛；花雌雄异株；雄花密集，花萼长约1毫米，无花冠；雌花疏离，花萼长2-3毫米，无花冠
  果: 翅果匙形，长3-4厘米，宽4-6毫米，先端锐尖，常梨头状，翅下延至坚果中部
生态习性:
  产地: 南北各省区
  分布: 越南、朝鲜
  生境: 多为栽培
  海拔: 800-1600m
  物候: 花期4-5月，果期7-9月
功用价值:
  经济价值: 本种在我国栽培历史悠久，分布甚广； 主要经济用途为放养白蜡虫生产白蜡，尤以西南各省栽培最盛； 贵州西南部山区栽的枝叶特别宽大，常在山地呈半野生状态； 性耐瘠薄干旱，在轻度盐碱地也能生长； 植株萌发力强，材理通直，生长迅速，柔软坚韧，供编制各种用具；树皮也作药用
  植物文化: 洋白蜡正名为美国红梣，原产美国东海岸至落基山脉一带，生于河湖边岸湿润地段；洋白蜡树姿美丽，我国引种已久，全国普遍栽培。其实二者是不同的物种；区别有三处：一、果不同；洋白蜡的翅果，翅长于种子或近等长；白蜡的翅果，翅短于种子；二、叶不同；洋白蜡的羽状复叶具小叶7-9枚，小叶柄基部几不膨大，叶片较细瘦；白蜡的羽状复叶具小叶5-7枚，小叶柄基部囊状膨大，叶片较宽；三、花序不同；洋白蜡的花序生于去年生枝之上，白蜡的花序生于当年生枝上。
植物志: '20. 白蜡树（四川，中国树木分类学）　图版8: 7-10

  Fraxinus chinensis Roxb. Fl. Ind. 1: 150. 1820; DC. Prodr. 8: 277. 1844; Hemsl. in Journ. Linn. Soc. Bot. 26: 85. 1889; Lingelsh. in Bot. Jahrb. 40: 216. 1907 et in Publ. Arn. Arb. 4(4): 260. 1914 et in Engl. Pflanzenr. 72(Ⅳ-243): 28, f. 8, A. 1920; Gagnep. in Lecomte, Fl. Gen. Indo-Chine 3: 1065. 1933; Hand.-Mazz. Symb. Sin. 7:1005. 1936; 陈嵘, 中国树木分类学 1058, 图941. 1937; 中国高等植物图鉴 3: 345, 图4644. 1974; 华北树木志 568, 图602. 1984; 云南植物志 4. 611. 1986. ——F. chinensis var. rotundata Lingelsh. l. c. 29. 1920.

  落叶乔木，高10-12米；树皮灰褐色，纵裂。芽阔卵形或圆锥形，被棕色柔毛或腺毛。小枝黄褐色，粗糙，无毛或疏被长柔毛，旋即秃净，皮孔小，不明显。羽状复叶长15-25厘米；叶柄长4-6厘米，基部不增厚；叶轴挺直，上面具浅沟，初时疏被柔毛，旋即秃净；小叶5-7枚，硬纸质，卵形、倒卵状长圆形至披针形，长3-10厘米，宽2-4厘米，顶生小叶与侧生小叶近等大或稍大，先端锐尖至渐尖，基部钝圆或楔形，叶缘具整齐锯齿，上面无毛，下面无毛或有时沿中脉两侧被白色长柔毛，中脉在上面平坦，侧脉8-10对，下面凸起，细脉在两面凸起，明显网结；小叶柄长3-5毫米。圆锥花序顶生或腋生枝梢，长8-10厘米；花序梗长2-4厘米，无毛或被细柔毛，光滑，无皮孔；花雌雄异株；雄花密集，花萼小，钟状，长约1毫米，无花冠，花药与花丝近等长；雌花疏离，花萼大，桶状，长2-3毫米， 4浅裂，花柱细长，柱头2裂。翅果匙形，长3-4厘米，宽4-6毫米，上中部最宽，先端锐尖，常呈犁头状，基部渐狭，翅平展，下延至坚果中部，坚果圆柱形，长约1.5厘米；宿存萼紧贴于坚果基部，常在一侧开口深裂。花期4-5月，果期7-9月。

  产于南北各省区。多为栽培，也见于海拔800-1600米山地杂木林中。越南、朝鲜也有分布。

  本种在我国栽培历史悠久，分布甚广。主要经济用途为放养白蜡虫生产白蜡，尤以西南各省栽培最盛。贵州西南部山区栽的枝叶特别宽大，常在山地呈半野生状态。性耐瘠薄干旱，在轻度盐碱地也能生长。植株萌发力强，材理通直，生长迅速，柔软坚韧，供编制各种用具；树皮也作药用。

  本种最迟于18世纪末期已引入印度、日本以及欧洲和美国。模式标本采自原产我国引种于印度的植株。'
