俗名:
- 老鸹瓢(lǎo guā piáo)
- 白环藤(bái huán téng)
异名:
- Metaplexis rostellata
- Metaplexis japonica
- Pergularia japonica
- Metaplexis stauntonii
- Urostelma chinensis
- Metaplexis chinensis
