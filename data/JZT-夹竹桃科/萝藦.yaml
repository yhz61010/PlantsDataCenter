分类信息:
  模式产地: 模式标本采自日本
形态特征:
  生活型: 草质藤本
  株: 长达8米
  茎: 幼茎密被短柔毛，老渐脱落
  叶: 叶膜质，卵状心形，先端短渐尖，基部心形，两面无毛，或幼时被微毛，侧脉10-12对；叶柄长3-6厘米，顶端具簇生腺体
  花: 聚伞花序具13-20花；花序梗长6-12厘米，被短柔毛；小苞片膜质，披针形，长约3毫米；花梗长约8毫米，被微毛；花蕾圆锥状，顶端骤尖；花萼裂片披针形，被微毛；花冠白色，有时具淡紫色斑纹，花冠筒短，裂片披针形，内面被柔毛；柱头2裂
  果: 蓇葖又生，纺锤形，平滑无毛，长8-9厘米，直径2厘米，顶端急尖，基部膨大；种子扁平，卵圆形，长5毫米，宽3毫米，有膜质边缘，褐色，顶端具白色绢质种毛；种毛长1.5厘米
生态习性:
  产地: 东北、华北、华东和甘肃、陕西、贵州、河南和湖北等省区
  分布: 日本、朝鲜和俄罗斯
  生境: 林边荒地、山脚、河边、路旁灌木丛中
  物候: 花期7-8月，果期9-12月
