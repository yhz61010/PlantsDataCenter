学名: Rumex crispus L.
中文名: 皱叶酸模
俗名:
- 土大黄
异名:
- Lapathum crispum
描述: 多年生草本，高40–80厘米。茎直立。基生叶长圆状披针形，边缘波状皱褶。圆锥花序大型，花两性，淡绿色。瘦果卵形，具三棱，褐色。花期5–6月，果期6–7月。我国各地广布。生于田边、路旁、湿地，根可入药，清热凉血、杀虫止痒，全株有毒。
分类系统:
  界: Plantae-植物界(zhí wù jiè)
  门: Tracheophyta-维管植物门(wéi guǎn zhí wù mén)
  纲: Magnoliopsida-木兰纲(mù lán gāng)
  目: Caryophyllales-石竹目(shí zhú mù)
  科: Polygonaceae-蓼科(liǎo kē)
  属: Rumex-酸模属(suān mó shǔ)
物种保护: 暂无数据
分类信息: 暂无数据
形态特征:
  生活型: 多年生草本
  株: 高达1米
  茎: 茎常不分枝，无毛
  叶: 基生叶披针形或窄披针形，长10-25厘米，宽2-5厘米，先端尖，基部楔形，边缘皱波状，无毛，叶柄稍短于片；茎生叶窄披针形，具短柄
  花: 花梗细，中下部具关节：外花被片椭圆形，长约1毫米；内花被片果时增大，宽卵形，长4-5毫米，基部近平截，近全缘，全部具小瘤，稀1片具小瘤，小瘤卵形，长1.5-2毫米
  果: 瘦果卵形，具3锐棱
生态习性:
  产地: 东北、华北、西北、山东、河南、湖北、四川、贵州及云南
  分布: 高加索、哈萨克斯坦、俄罗斯（西伯利亚、远东）、蒙古、朝鲜、日本、欧洲及北美
  生境: 河滩、沟边湿地
  海拔: 30-2500m
  物候: 花两性；花序窄圆锥状，分枝近直立
功用价值: 暂无数据
植物志: '14．皱叶酸模（中国北部植物图志）图版37: 1-2

  Rumex crispus L. Sp. Pl. 335. 1753; Forb. et Hemsl. in Journ. Linn. Soc. Bot. 6: 356. 1891, p. p.; Kung in Fl. Ill. N. Chine 5: 21. pl. 6. 1936. excl. syn.; R. japonicus Meisn. R. regeli F. Schm.; Rech. f. in Candollea 12: 80. 1949; Ohwi, Fl. Jap. 460. 1956;东北草本植物志2: 25. 1959: Байт. и Павл. во Фл. Каэахст. 3: 96. 1960; 湖北植物志2: 255.图348. 1976;台湾植物志2: 25. 1976; Kitag. Neo-Lineam. 245. 1979; Груб. Опред. Раст. Монг. 81. 1982; Borod. in Pl. Asiae Centr. 9: 81. 1989.

  多年生草本。根粗壮，黄褐色。茎直立，高50-120厘米，不分枝或上部分枝，具浅沟槽。基生叶披针形或狭披针形，长10-25厘米，宽2-5厘米，顶端急尖，基部楔形，边缘皱波状；茎生叶较小狭披针形；叶柄长3-10厘米；托叶鞘膜质，易破裂。花序狭圆锥状，花序分枝近直立或上升；花两性；淡绿色；花梗细，中下部具关节，关节果时稍膨大；花被片6, 外花被片椭圆形，长约1毫米，内花被片果时增大，宽卵形，长4-5毫米，网脉明显，顶端稍钝，基部近截形，边缘近全缘，全部具小瘤，稀1片具小瘤，小瘤卵形，长1.5-2毫米。瘦果卵形，顶端急尖，具3锐棱，暗褐色，有光泽。花期5-6月，果期6-7月。

  产东北、华北、西北、山东、河南、湖北、四川、贵州及云南。生河滩、沟边湿地，海拔30-2500米。高加索、哈萨克斯坦、俄罗斯（西伯利亚、远东）、蒙古、朝鲜、日本、欧洲及北美也有。'
