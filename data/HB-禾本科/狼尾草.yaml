植物志: '6. 狼尾草（本草拾遗）　[艹/戾]草（植物名实图考），狗尾巴草（浙江），芮草（江苏），老鼠狼，狗仔尾（广东）　图版111: 1-4

  Pennisetum alopecuroides (L.) Spreng. Syst. 1: 303. 1825; 广州植物志 823. 1956; 中国主要植物图说 禾本科 713. 1959; Bor, Grass. Burm. Ceyl. Ind. Pakist. 343. 1960; 华东禾本科植物志 214. 1962; 台湾的禾草 597. 1975; 台湾植物志 590. 图1442: 1978; 中国高等植物图鉴 5: 174. 图7178. 1976; 江苏植物志 (上册): 229. 图392. 1977; 秦岭植物志 1(1): 162. 1976. ——Panicum alopecuroides L. Sp. Pl. 55. 1753. ——Pennisetum compressum R. Br. Prod, 195. 1810. ——Pennisetum purpurascens (Thunb.) Makino in Bot. Mag. Tokyo. 26: 294. 1912. ——Pennsetun purpurascens f. Chinense (Nees) Leek, Zeitschri Naturwiss. 79: 37. 1907. ——Pennisetum alopecuroides f. purpurascens (Thunb.) Ohwi in Acta Phytotax. et Geobot. 10: 274. 1941, syn. nov. ——Pennisetum alopecuroides f. viridescens (Miq.) Ohwi in Acta Phytotax. et Geobot. 10: 174. 1941, syn. nov. ——Pennisetum erythrochaetum Ohwi in Acta Phytotax. et Geobot. 4: 59. 1935. ——Pennisetum dispeculatum Chia, 海南植物志 4: 440. 图1230. 1977, syn. nov.

  多年生。须根较粗壮。秆直立，丛生，高30-120厘米，在花序下密生柔毛。叶鞘光滑，两侧压扁，主脉呈脊，在基部者跨生状，秆上部者长于节间；叶舌具长约2.5毫米纤毛；叶片线形，长10-80厘米，宽3-8毫米，先端长渐尖，基部生疣毛。圆锥花序直立，长5-25厘米，宽1.5-3.5厘米；主轴密生柔毛；总梗长2-3（-5）毫米；刚毛粗糙，淡绿色或紫色，长1.5-3厘米；小穗通常单生，偶有双生，线状披针形，长5-8毫米；第一颖微小或缺，长1-3毫米，膜质，先端钝，脉不明显或具1脉；第二颖卵状披针形，先端短尖，具3-5脉，长约为小穗1/3-2/3；第一小花中性，第一外稃与小穗等长，具7-11脉；第二外稃与小穗等长，披针形，具5-7脉，边缘包着同质的内稃；鳞被2，楔形；雄蕊3，花药顶端无毫毛；花柱基部联合。颖果长圆形，长约3.5毫米。叶片表皮细胞结构为上下表皮不同；上表皮脉间细胞2-4行为长筒状、有波纹、壁薄的长细胞；下表皮脉间5-9行为长筒形，壁厚，有波纹长细胞与短细胞交叉排列。染色体2n=18（Tateoka，1953; Chen，Hsu， 1961）。花果期夏秋季。

  我国自东北、华北经华东、中南及西南各省区均有分布；多生于海拔50-3 200米的田岸、荒地、道旁及小山坡上。日本、印度、朝鲜、缅甸、巴基斯坦、越南、菲律宾、马来西亚、大洋洲及非洲也有分布。

  可作饲料；也是编织或造纸的原料；也常作为土法打油的油杷子；也可作固堤防沙植物。

  本种小穗单生，偶有2-3枚簇生，在大量标本中河南省豫北植物队177号的穗状花序上部常单生，下部多双生；同时，小穗单生或2-3枚簇生的特征，在本属中其它种群中同样存在，故将双穗狼尾草P. dispculatum Chia归并入本种。'
