学名: Lantana camara L.
中文名: 马缨丹
俗名:
- 七变花
- 如意草
- 臭草
- 五彩花
- 五色梅
异名: 无
描述: 暂无数据
分类系统:
  界: Plantae-植物界(zhí wù jiè)
  门: Tracheophyta-维管植物门(wéi guǎn zhí wù mén)
  纲: Magnoliopsida-木兰纲(mù lán gāng)
  目: Lamiales-唇形目(chún xíng mù)
  科: Verbenaceae-马鞭草科(mǎ biān cǎo kē)
  属: Lantana-马缨丹属(mǎ yīng dān shǔ)
物种保护: 暂无数据
分类信息: 暂无数据
形态特征:
  生活型: 灌木或蔓性灌木
  株: 高达2米
  茎: 茎枝常被倒钩状皮刺
  叶: 叶卵形或卵状长圆形，长3-8.5厘米，先端尖或渐尖，基部心形或楔形，具钝齿，上面具触纹及短柔毛，下面被硬毛，侧脉约5对；叶柄长约1厘米
  花: 花序径1.5-2.5厘米，花序梗粗，长于叶柄；苞片披针形；花萼管状，具短齿；花冠黄或橙黄色，花后深红色
  果: 果球形，径约4毫米，紫黑色
生态习性:
  产地: 现在我国台湾、福建、广东、广西见有逸生。
  分布: 世界热带地区均有分布
  生境: 海边沙滩和空旷地区
  海拔: 80-1500m
  物候: 全年开花
功用价值:
  经济价值: 花美丽，我国各地庭园常栽培供观赏。根、叶、花作药用，有清热解毒、散结止痛、祛风止痒之效；可治疟疾、肺结核、颈淋巴结核、腮腺炎、胃痛、风湿骨痛等
植物志: '1. 马缨丹（种子植物名称）　五色梅（华北），五彩花（福建），臭草、如意草（广东、广西、福建），七变花（华北经济植物志要）　图4

  Lantana camara Linn. Sp. Pl. 627. 1753; Schauer in DC. Prodr. 11: 598. 1847; Benth. Fl. Hongk. 268. 1861; Maxim. in Bull. Acad. Sci. St. P''etersb. 31: 73. 1886; Forbes et Hemsl. in Journ. Linn. Soc. Bot. 26: 351. 1890; Dunn et Tutch. in Kew Bull. Add. Ser. 10: 201. 1912; Chung in Mem. Sci. Soc. China 1(1): 225. 1924; Merr. in Lingn. Sci. Journ. 5: 157. 1927; P''ei in Mem. Sci. Soc. China 1(3): 9. 1932; 陈嵘, 中国树木分类学, 1102, 图990. 1937; 侯宽昭等, 广州植物志 625, 图331. 1956; 中国高等植物图鉴 3: 578. 图5110. 1974; 海南植物 4: 3. 图944. 1977; 云南植物志 1: 394, 图版94, 1-3. 1977. ——Lantana aculeata Linn. Sp. Pl. 627. 1753. pro parte.

  直立或蔓性的灌木，高1-2米，有时藤状，长达4米；茎枝均呈四方形，有短柔毛，通常有短而倒钩状刺。单叶对生，揉烂后有强烈的气味，叶片卵形至卵状长圆形，长3-8.5厘米，宽1.5-5厘米，顶端急尖或渐尖，基部心形或楔形，边缘有钝齿，表面有粗糙的皱纹和短柔毛，背面有小刚毛，侧脉约5对；叶柄长约1厘米。花序直径1.5-2.5厘米；花序梗粗壮，长于叶柄；苞片披针形，长为花萼的1-3倍，外部有粗毛；花萼管状，膜质，长约1.5毫米，顶端有极短的齿；花冠黄色或橙黄色，开花后不久转为深红色，花冠管长约1厘米，两面有细短毛，直径4-6毫米；子房无毛。果圆球形，直径约4毫米，成熟时紫黑色。全年开花。

  原产美洲热带地区，现在我国台湾、福建、广东、广西见有逸生。常生长于海拔80-1500米的海边沙滩和空旷地区。世界热带地区均有分布。

  花美丽，我国各地庭园常栽培供观赏。根、叶、花作药用，有清热解毒、散结止痛、祛风止痒之效；可治疟疾、肺结核、颈淋巴结核、腮腺炎、胃痛、风湿骨痛等（《海南植物志》）。'
