学名: Hydrangea paniculata Siebold
中文名: 圆锥绣球
俗名:
- 水亚木
- 栎叶绣球
- 湖溲疏(hú sōu shū)
- 白花丹(bái huā dān)
异名:
- Hydrangea kamienskii
- Hydrangea sachalinensis
- Hydrangea verticillata
描述: 暂无数据
分类系统:
  界: Plantae-植物界(zhí wù jiè)
  门: Tracheophyta-维管植物门(wéi guǎn zhí wù mén)
  纲: Magnoliopsida-木兰纲(mù lán gāng)
  目: Cornales-山茱萸目(shān zhū yú mù)
  科: Hydrangeaceae-绣球科(xiù qiú kē)
  属: Hydrangea-绣球属(xiù qiú shǔ)
物种保护:
  濒危等级: 无危(LC)
分类信息: 暂无数据
形态特征:
  生活型: 灌木或小乔木
  株: 高达5(-9)米
  枝: 幼枝疏被柔毛，具圆形浅色皮孔
  叶: 叶纸质，2-3片对生或轮生，卵形或椭圆形，长5-14厘米，先端渐尖或骤尖，具短尖头，基部圆或宽楔形，密生小锯齿，上面无毛或疏被糙伏毛，下面沿中脉侧脉被紧贴长柔毛，侧脉6-7对；叶柄长1-3厘米
  花: 圆锥状聚伞花序长达26厘米，密被柔毛；不育花白色，萼片4;孕性花萼筒陀螺状，长约1.1毫米；萼齿三角形，长约1毫米；花瓣分离，白色，卵形或披针形，基部平截；雄蕊不等长，较长的于花蕾时内折；子房半下位，花柱3，长约1毫米，钻状
  果: 蒴果椭圆形，不连花柱长4-5.5毫米，顶端突出部分圆锥形，与萼筒近等长
  种子: 种子褐色，纺锤形，两端有窄长翅
生态习性:
  产地: 西北（甘肃）、华东、华中、华南、西南等地区
  分布: 日本
  生境: 山谷、山坡疏林下或山脊灌丛中
  海拔: 360-2100m
  物候: 花期7-8月，果期10-11月
功用价值: 暂无数据
植物志: '21．圆锥绣球（中国植物图谱）糊溲疏、水亚木（福建），白花丹（广东、广西），轮叶绣球（植物分类学报）图版49：1-4

  Hydrangea paniculata Sieb. in Nov. Act. Acad. Caes. Leop. Carol. 14 (2): 691. 1829; Sieb. ＆ Zucc. Fl. Jap. 1: 115. tab. 61. 1835; Ser. in DC. Prodr. 4: 666. 1830; Maxim. in Mem. Acad. Sci. St. Petrersb. ser. 7, 10 (16): 9. 1867 (excl. var.); Hemsl. in Journ. Linn. Soc. Bot. 23: 274. 1887; Dipp. Handb. Laubh. 3: 316. 1893; Rehd. in Sargent, Pl. Wils. 1: 25. 1911 et Journ. Arn. Arb. 8: 114. 1927 et 14: 202. 1933; Hand. -Mazz. Symb. Sin. 1: 443. 1931; Hu in Hu ＆ Chun, Icon. Pl. Sin. pl. 136, 1933; 陈嵘, 中国树木分类学 383. 1937 (excl. var.); Bailey, Man. Cult. Pl. 475. 1949 (excl. var.); Chun in Acta Phytotxa. Sin. 3 (2): 139. 1954; McClintock in Proc. Calif. Acad. Sci. 29 (5): 211. 1957; 中国高等植物图鉴 2: 106. 图1942, 1972; Li, Fl. Taiwan 3: 39. 1977; 福建植物志2: 228. 1985. ——H. kamienskii Levl. in Bull. Acad. Geogr. Bot. 12: 115. 1903 et Fl. Kouy-Tcheou 388. 1915; Rehd. op. cit. 41. 1911 et op. cit. 12: 277. 1931; Chun l. c. 1954. ——H. sachalinensis Levl. in Fedde, Repert. Sp. Nov. 8: 282. 1910; Rehd. l. c. 1931; Chun op. cit. 3 (2): 140. 1954. ——H. schindleri Engl. in Engl. u. Prantl, Nat. Pflanzenfam. Aufl. 2, 18a: 203. 1930. p. p. ; Rehd. l. c. 1933; Chun l. c. 1954. ——H. verticillata W. H. Gao in Acta Phytotax. Sin. 25 (5): 410. 1987.

  灌木或小乔木，高1-5米，有时达9米，胸径约20厘米；枝暗红褐色或灰褐色，初时被疏柔毛，后变无毛，具凹条纹和圆形浅色皮孔。叶纸质，2-3片对生或轮生，卵形或椭圆形，长5-14厘米，宽2-6.5厘米，先端渐尖或急尖，具短尖头，基部圆形或阔楔形，边缘有密集稍内弯的小锯齿，上面无毛或有稀疏糙伏毛，下面于叶脉和侧脉上被紧贴长柔毛；侧脉6-7对，上部微弯，小脉稠密网状，下面明显；叶柄长1-3厘米。圆锥状聚伞花序尖塔形，长达26厘米，序轴及分枝密被短柔毛；不育花较多，白色；萼片4，阔椭圆形或近圆形，不等大，结果时长1-1.8厘米，宽0.8-1.4厘米，先端圆或微凹，全缘；孕性花萼筒陀螺状，长约1.1毫米，萼齿短三角形，长约1毫米，花瓣白色，卵形或卵状披针形，长2.5-3毫米，渐尖；雄蕊不等长，长的长达4.5毫米，短的略短于花瓣，花药近圆形，长约0.5毫米；子房半下位，花柱3，钻状，长约1毫米，直，基部连合，柱头小，头状。蒴果椭圆形，不连花柱长4-5.5毫米，宽3-3.5毫米，顶端突出部分圆锥形，其长约等于萼筒；种子褐色，扁平，具纵脉纹，轮廓纺锤形，两端具翅，连翅长2.5-3.5毫米，其中翅长0.8-1.2毫米，先端的翅稍宽。花期7-8月，果期10-11月。

  产西北（甘肃）、华东、华中、华南、西南等地区。生于山谷、山坡疏林下或山脊灌丛中，海拔360-2100米。日本也有分布。'
