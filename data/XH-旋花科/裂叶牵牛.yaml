学名: Ipomoea hederacea (L.) Jacq.
中文名: 裂叶牵牛
俗名:
- 裂叶牵牛全缘叶变种
异名:
- Ipomoea hederacea var. integriuscula
描述: 牵牛（Ipomoea nil (L.) Roth）的近似种，现分类学地位存在争议，部分分类学家由分子生物学证据认为其应为圆叶牵牛及牵牛的不同生态型，但也有分类学家按其他证据认为其应为独立物种；
分类系统:
  界: Plantae-植物界(zhí wù jiè)
  门: Tracheophyta-维管植物门(wéi guǎn zhí wù mén)
  纲: Magnoliopsida-木兰纲(mù lán gāng)
  目: Solanales-茄目(qié mù)
  科: Convolvulaceae-旋花科(xuán huā kē)
  属: Ipomoea-番薯属(fān shǔ shǔ)
物种保护: 暂无数据
分类信息:
  学名释意: Ipomoea hederacea Jacq. （Syn. Ipomoea hederacea Jacq. var. integriuscula A. Gray）
  分类文献: 'Collectanea 1: 124 (1786)'
  模式标本: W0032941（Bianchini,2014）；PE01143186（Austin et al.,2014）
  模式产地: 辽宁旅顺口区
  分类讨论: 与牵牛（Ipomoea nil (L.) Roth）的区别为：花冠直径较小，萼片反卷，叶偶见五裂。
形态特征:
  识别要点: 花冠直径较小，萼片反卷，叶偶见五裂
  生活型: 一年生缠绕草本
  株: 全株被粗硬毛，长2~5米
  茎: 茎缠绕
  叶: 叶互生，心状卵形，全缘或3~5裂，长4~15cm，中裂片卵圆形，侧裂三角形，裂口弧形内凹，叶柄长2~15cm
  花: 花序有花1~3朵，总花梗长2.5~5cm，苞片2，披针形；萼片近等长，长约1.5~1.8cm，披针形，先端向外翻卷，内面2片稍狭，外面被开展的刚毛，基部更密；花冠漏斗状，长5~8cm，蓝紫色，花冠管色淡；雄蕊及花柱内藏，雄蕊5，不等长；花丝基部被柔毛，子房无毛，3室，柱头头状
  果: 蒴果近球形，3瓣裂
  种子: 种子卵状三棱形，长约5mm，黑色或黑褐色，表面粗糙
生态习性:
  产地: 全国广泛栽培或野生
  分布: 原产热带美洲，现广植于热带及亚热带地区
  生境: 生于田边、路旁、河谷、宅园、果园、山坡、苗圃或栽培
  物候: 花期6~9月，果期9~10月
功用价值: 暂无数据
植物志: 暂无数据
