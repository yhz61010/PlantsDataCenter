形态特征:
  生活型: 一年生草本
  株: 长2-5米
  茎: 茎缠绕
  叶: 叶宽卵形或近圆形，长4-15厘米，3(-5)裂，先端渐尖，基部心形；叶柄长2-15厘米
  花: 花序腋生，具1至少花，花序梗长1.5-18.5厘米；苞片线形或丝状，小苞片线形；花梗长2-7毫米；萼片披针状线形，长2-2.5厘米，内2片较窄，密被开展刚毛；花冠蓝紫或紫红色，筒部色淡，长5-8(-10)厘米，无毛；雄蓝及花柱内藏；子房3室
  果: 蒴果近球形，径0.8-1.3厘米；种子卵状三棱形，黑揭或米黄色，长5-6毫米，被微柔毛
  种子: 种子卵状三棱形，长约6毫米，黑褐色或米黄色，被褐色短绒毛
生态习性:
  产地: 本种原产热带美洲，现已广植于热带和亚热带地区
  生境: 山坡灌丛、干燥河谷路边、园边宅旁、山地路边，或为栽培
  海拔: 100-1600m
