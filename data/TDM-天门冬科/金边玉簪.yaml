学名: Hosta 'Green Gold'
中文名: 金边玉簪
俗名: 无
异名: 无
描述: 金边玉簪不仅具有玉簪的优良特性, 而且叶片色泽鲜明、复色叶面彩条清晰, 叶脉脉络明显, 是非常优良的盆栽和绿化品种。金边玉簪对喜阳花卉有极强的互补性, 在园林工程中可配置于林下做地被, 或栽于建筑物的周围庇荫处, 以达到提升园林观赏效果的目的。
